<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Media Downloader</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: pan-x pan-y;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Header Navigation Bar */
        header {
            width: 100%;
            background: #ffffff;
            padding: 18px 6%;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .header-title {
            font-size: 26px;
            font-weight: bold;
            color: #2563eb;
            margin: 0;
        }

        /* Main Wrapper for Centering the Form */
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
        }

        /* Card Container */
        .card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            position: relative;
            z-index: 1;
        }

        /* Unique Styled Form Banner/Header */
        .card-header {
            background: linear-gradient(135deg, #2563eb, #6d28d9);
            color: #ffffff;
            padding: 25px 20px;
            text-align: center;
        }

        .card-header h3 {
            margin: 0;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .card-header p {
            margin: 6px 0 0;
            font-size: 13px;
            opacity: 0.85;
        }

        /* Form Content Area */
        .card-body {
            padding: 25px 30px 30px;
        }

        .form-group { 
            margin-bottom: 18px; 
        }

        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: bold; 
            color: #475569; 
            font-size: 14px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input[type="text"]:focus, select:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover { 
            background-color: #cc0000; 
        }

        button:disabled { 
            background-color: #aa9999; 
            cursor: not-allowed; 
        }

        .message { 
            margin-top: 15px; 
            text-align: center; 
            font-weight: bold; 
            min-height: 20px; 
            font-size: 14px;
        }

        .success { color: green; }
        .error { color: red; }
        .info { color: #0056b3; }
    </style>
</head>
<body>

<!-- Top Header Navigation -->
<header>
    <h1 class="header-title">Media Downloader</h1>
</header>

<!-- Centered Content -->
<div class="main-container">
    <div class="card">
        <!-- Unique Form Block Banner -->
        <div class="card-header">
            <h3>⚡ Quick Video Saver</h3>
            <p>Convert and download high quality audio & video instantly</p>
        </div>

        <div class="card-body">
            <form id="downloadForm">
                <div class="form-group">
                    <label for="url">Video Link:</label>
                    <input type="text" id="url" name="url" placeholder="Paste YouTube link here..." required>
                </div>
                <div class="form-group">
                    <label for="type">Download Type:</label>
                    <select id="type" name="type">
                        <option value="video">Video (Best Quality)</option>
                        <option value="audio">Audio Only (Best Audio)</option>
                    </select>
                </div>
                <button type="submit" id="submitBtn">Download</button>
            </form>

            <div id="statusMessage" class="message"></div>
        </div>
    </div>
</div>

<script>
// Prevent Zooming Script
document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0' || e.code === 'NumpadAdd' || e.code === 'NumpadSubtract')) {
        e.preventDefault();
    }
});

document.addEventListener('wheel', function (e) {
    if (e.ctrlKey) {
        e.preventDefault();
    }
}, { passive: false });

document.addEventListener('gesturestart', function (e) {
    e.preventDefault();
});

document.addEventListener('touchstart', function (e) {
    if (e.touches.length > 1) {
        e.preventDefault();
    }
}, { passive: false });

// Existing Form Submission Script
document.getElementById('downloadForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMessage');
    const formData = new FormData(this);

    // Disable button & update status bar
    submitBtn.disabled = true;
    statusMsg.className = "message info";
    statusMsg.innerText = "Processing & Downloading on Server... Please wait.";

    try {
        const response = await fetch('/download', {
            method: 'POST',
            body: formData
        });

        const result = await response.json();

        if (result.success) {
            statusMsg.className = "message success";
            statusMsg.innerText = result.message;
            // Trigger automatic file download in browser
            window.location.href = result.file_url;
        } else {
            statusMsg.className = "message error";
            statusMsg.innerText = result.message;
        }
    } catch (err) {
        statusMsg.className = "message error";
        statusMsg.innerText = "Server Error. Check terminal output.";
    } finally {
        submitBtn.disabled = false;
    }
});
</script>

</body>
</html>
